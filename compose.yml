services:
  xo-proxy:
    image: ghcr.io/fr0g-not-found/xo-proxy-ce:latest
    container_name: xo-proxy
    pull_policy: always
    restart: unless-stopped
    ports:
      - "192.0.2.10:443:443"
    volumes:
      - /mnt/POOL/docker/xo-proxy/config:/etc/xo-proxy
      - /mnt/POOL/docker/xo-proxy/data:/var/lib/xo-proxy
      - /mnt/POOL/xo-backups:/backups
    environment:
      XO_PROXY_PORT: "443"
      XO_PROXY_NAME: "CHANGE-ME"
      XO_PROXY_ADDRESS: "192.0.2.10:443"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
