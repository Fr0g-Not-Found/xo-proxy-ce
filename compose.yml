services:
  xo-proxy:
    image: ghcr.io/fr0g-not-found/xo-proxy-ce:latest
    container_name: xo-proxy
    pull_policy: always
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./config:/etc/xo-proxy
      - ./data:/var/lib/xo-proxy
    environment:
      XO_PROXY_PORT: "443"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
